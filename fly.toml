# Fly.io configuration for StreamFlow application
app = "streamflow-app"
primary_region = "iad"  # Washington DC - change to your preferred region

[build]

[env]
  PORT = "8000"
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

[mounts]
  source = "streamflow_data"
  destination = "/app/uploads"

[processes]
  app = "./docker-entrypoint.sh"

# Secrets will be set via flyctl secrets set
# Required secrets:
# - DATABASE_URL
# - SECRET_KEY
# - REDIS_URL (optional) 