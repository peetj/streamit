version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.dev
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot reloading
      - ./client:/streamflow/client
      - /streamflow/client/node_modules  # Exclude node_modules from mount
    environment:
      - CHOKIDAR_USEPOLLING=true  # Better file watching in Docker
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend.dev
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://streamflow_user:streamfl0w@db:5432/streamflow_music?sslmode=disable
      - SECRET_KEY=${SECRET_KEY}
      - REDIS_URL=redis://redis:6379
    volumes:
      # Mount source code for development
      - ./app:/streamflow/app
      - ./uploads:/streamflow/uploads
    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=streamflow_music
      - POSTGRES_USER=streamflow_user
      - POSTGRES_PASSWORD=streamfl0w
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data: 